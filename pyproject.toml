[project]
name = "a2a-reasoning-capture"
version = "0.1.0"
description = "Experiments on what crosses the A2A boundary between two agents: reasoning, context, multi-turn."
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.3.0",
    "anthropic>=2.8.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
a2a-exp = "a2a_reasoning_capture.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
