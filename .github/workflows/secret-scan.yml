# Scans every push and pull request (full git history) for secrets such as API
# keys and tokens, using gitleaks. The job fails if anything is found.
#
# This is the backstop. The first lines of defence are GitHub push protection
# (blocks the push) and the local pre-commit hook in .githooks/ (blocks the commit).

name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # lets gitleaks comment on the offending line of a pull request

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so a secret in any past commit is caught

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # same version as the local pre-commit hook
